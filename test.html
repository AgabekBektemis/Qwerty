<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ассоциативный тест</title>
<style>
:root{--bg:#f6f2ff;--card:#fff;--text:#2a2340;--muted:#7a7194;--accent:#7c4dff;--accent2:#ff6fae;--line:#e4dcf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17132a;--card:#241e3d;--text:#f1ecff;--muted:#a79ec7;--accent:#9b7bff;--accent2:#ff7fb7;--line:#3a3160}}
:root[data-theme="dark"]{--bg:#17132a;--card:#241e3d;--text:#f1ecff;--muted:#a79ec7;--accent:#9b7bff;--accent2:#ff7fb7;--line:#3a3160}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 6px 24px rgba(124,77,255,.12)}
h1{font-size:26px;margin:0 0 10px}
h2{font-size:21px;margin:6px 0 4px}
p{margin:8px 0;color:var(--muted)}
.big{font-size:56px;text-align:center;margin:6px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;margin-top:16px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:2px solid var(--line);border-radius:14px;padding:13px 15px;font-size:16px;margin-top:10px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.cnt{font-size:13px;color:var(--muted);margin-bottom:12px}
.q{font-size:19px;font-weight:600;margin:0}
.hint{font-size:14px;color:var(--muted);margin:4px 0 0}
.res{border-top:1px solid var(--line);padding:14px 0}
.res:first-of-type{border-top:0}
.tag{font-size:13px;color:var(--muted)}
.ans{display:inline-block;background:var(--accent);color:#fff;border-radius:20px;padding:2px 12px;font-size:14px;margin:4px 0}
.back{background:none;border:0;color:var(--muted);font-size:14px;margin-top:14px;cursor:pointer;padding:6px 0}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
const Q=[
["🐕","Собака","твоя карьера и отношение к работе","Представь собаку. Какая она?",[["Милая, добрая","Хочется, чтобы работа приносила удовольствие."],["Сильная, большая","Важны достижения и признание."],["Послушная","Комфортно работать по правилам."],["Свободная, дикая","Хочется независимости."],["Агрессивная","Работа ассоциируется с конкуренцией и напряжением."]]],
["🐈","Кошка","твоё представление о любви","Представь кошку. Какая она?",[["Ласковая","Хочется нежности и заботы."],["Независимая","Важно личное пространство."],["Загадочная","Привлекают интрига и неизвестность."],["Холодная","Может быть трудно открываться в чувствах."],["Игривая","Хочется лёгкости и веселья в отношениях."]]],
["🌲","Лес","твоё восприятие жизни","Ты идёшь по лесу. Какой он?",[["Красивый","Хочется видеть в жизни хорошее."],["Тёмный","Жизнь может казаться непредсказуемой."],["Спокойный","Ценишь стабильность."],["Густой и непроходимый","Будущее может представляться сложным."],["Солнечный","Жизнь ассоциируется с надеждой и возможностями."]]],
["🌊","Море","твой внутренний мир и эмоции","Ты выходишь из леса и видишь море. Какое оно?",[["Спокойное","Стремишься к душевному равновесию."],["Бурное","Сильные эмоции занимают важное место в твоём восприятии себя."],["Глубокое","Интерес к своим мыслям и чувствам."],["Тёплое","Ассоциации с комфортом и близостью."],["Холодное","Потребность в дистанции или защищённости."]]],
["🏠","Дом","твоё представление об идеальной жизни","Дом твоей мечты. Какой он?",[["Большой","Хочется пространства и возможностей."],["Уютный","Важны безопасность и комфорт."],["Роскошный","Привлекают достаток и высокий уровень жизни."],["Маленький","Ценишь простоту и камерность."],["У моря или в лесу","Хочется спокойствия и свободы."]]],
["🥛","Вода в чашке","удовлетворённость жизнью","Ты видишь чашку с водой. Сколько в ней воды?",[["Полная","Ощущение достатка и наполненности."],["Наполовину полная","Видишь и возможности, и то, чего пока не хватает."],["Почти пустая","Возможно, хочется перемен или новых впечатлений."],["Пустая","Ощущение нехватки чего-то важного."]]],
["🧱","Стена","препятствия в твоей жизни","Ты видишь стену. Какая она?",[["Высокая","Препятствия кажутся серьёзными."],["Низкая","Трудности воспринимаются как преодолимые."],["Прозрачная","Хочется видеть выход даже при ограничениях."],["Разрушенная","Перемены или освобождение от старого."],["Красивая","Ограничения воспринимаются как полезные или необходимые."]]],
["🗝️","Ключ","твоё отношение к возможностям","Ты находишь ключ. Какой он?",[["Золотой","Хочется ценных возможностей и достижений."],["Старый","Интерес к прошлому и накопленному опыту."],["Маленький","Предпочитаешь небольшие, но значимые возможности."],["Большой","Хочется влиять на многое."],["Ржавый","Ассоциации с упущенными возможностями."]]],
["🛣️","Дорога","твой жизненный путь и будущее","Представь дорогу. Какая она?",[["Прямая","Хочется ясности и определённости."],["Извилистая","Допускаешь неожиданные повороты."],["Длинная","Жизнь воспринимается как большой путь."],["Короткая","Хочется быстрее прийти к результату."],["Светлая","Будущее ассоциируется с надеждой."],["Тёмная","Будущее кажется неизвестным."]]],
["🪞","Зеркало","отношение к себе","Ты смотришь в зеркало. Что чувствуешь?",[["Радость","Хочется принимать себя и замечать свои достоинства."],["Грусть","Есть темы, о которых непросто думать."],["Спокойствие","Образ себя не вызывает напряжения."],["Страх","Могут беспокоить самооценка или чужое мнение."],["Удивление","Интересно открывать в себе новое."]]],
["🐦","Птица","твоё представление о свободе","Представь птицу. Какая она?",[["Орёл","Свобода — это сила и независимость."],["Голубь","Свобода — это мир и спокойствие."],["Попугай","Свобода — это общение и яркость."],["Ласточка","Свобода — это движение и перемены."],["Птица в клетке","Ограничения и желание освободиться."]]],
["🕰️","Часы","твоё отношение ко времени","Ты видишь часы. Какие они?",[["Новые","Хочется начать с чистого листа."],["Старые","Прошлое имеет особое значение."],["Сломанные","Остановка или потеря ощущения времени."],["Красивые","Ценишь моменты и впечатления."],["Быстро идущие","Кажется, что время постоянно ускользает."]]],
["🌧️","Дождь","твоя реакция на трудности","Представь дождь. Какой он?",[["Тёплый","Трудности — это очищение и обновление."],["Сильный ливень","Сложности — интенсивные переживания."],["Мелкий и спокойный","Неприятности кажутся переносимыми."],["Холодный","Ассоциации с дискомфортом."],["Освежающий","Перемены воспринимаются положительно."]]],
["🚪","Закрытая дверь","твоя реакция на неизвестность","Ты стоишь перед закрытой дверью. Что чувствуешь?",[["Интерес","Хочется узнать, что за пределами знакомого."],["Страх","Неизвестность вызывает напряжение."],["Раздражение","Препятствия хочется преодолевать сразу."],["Спокойствие","Готов(а) подождать подходящего момента."],["Радость","Закрытая дверь — это новые возможности."]]],
["🌷","Цветок","твоё представление о собственной ценности","Представь цветок. Какой он?",[["Красивый","Хочется видеть в себе прекрасное."],["Редкий","Важна индивидуальность."],["Нежный","Ценишь мягкость и чувствительность."],["Сильный","Восхищаешься стойкостью."],["Увядающий","Потребность в отдыхе и заботе о себе."]]]
];
let i=0,A=[];
const app=document.getElementById('app');
function start(){i=0;A=[];intro()}
function intro(){
app.innerHTML=`<div class="card"><div class="big">🧠</div><h1>Что твои ответы говорят о тебе?</h1>
<p>15 коротких вопросов. Выбирай первый ответ, который приходит в голову — не пытайся подобрать «правильный». Расшифровка появится только в конце.</p>
<button class="btn" id="go">Начать тест</button>
<div class="note">Это развлекательная игра, а не научная диагностика.</div></div>`;
document.getElementById('go').onclick=show}
function show(){
const q=Q[i];
app.innerHTML=`<div class="card"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
<div class="cnt">Вопрос ${i+1} из ${Q.length}</div><div class="big">${q[0]}</div>
<p class="q">${q[3]}</p>
${q[4].map((o,k)=>`<button class="opt${A[i]===k?' sel':''}" data-k="${k}">${o[0]}</button>`).join('')}
${i>0?'<button class="back" id="bk">← Назад</button>':''}</div>`;
app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
A[i]=+b.dataset.k;
app.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
b.classList.add('sel');
setTimeout(()=>{i++;i<Q.length?show():result()},250)});
const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{i--;show()}}
function result(){
app.innerHTML=`<div class="card"><div class="big">🔮</div><h1>Твой результат</h1>
<p>Вот что значат твои ответы:</p>
${Q.map((q,n)=>{const o=q[4][A[n]];return `<div class="res"><div class="tag">${q[0]} ${q[1]} — ${q[2]}</div><span class="ans">${o[0]}</span><div>${o[1]}</div></div>`}).join('')}
<div class="note">Значения придуманы для игры. Ответ «агрессивная собака» не значит, что ты ненавидишь работу — возможно, ты просто вспомнил(а) конкретную собаку.</div>
<button class="btn" id="re">Пройти заново</button></div>`;
document.getElementById('re').onclick=start;window.scrollTo(0,0)}
start();
</script>
</body>
</html>
